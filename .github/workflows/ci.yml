name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Split across two runners, each with its own server.
    #
    # The suite shares one Wrangler process, and on a two-core runner that
    # process has fallen over part-way through several times now — during the
    # offline drills, during the accessibility sweep, and after an editing
    # test. Every test after it fails with a refused connection, which reads as
    # a broken change and is not one. There is no test in common between the
    # occurrences and Wrangler prints `✘ [ERROR]` with an empty body, so the
    # cause is still unknown; halving what any one server has to survive is the
    # part of it we control, and the log capture below is how the next one gets
    # diagnosed rather than guessed at.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The suite runs against the production build served at one origin,
      # because a service worker does not behave the same under the dev server.
      - run: pnpm --filter @vadevi/web build
      - run: pnpm e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
      # Wrangler names this file on its way out and we have never read one.
      # When the server dies the console message is empty, so this is the only
      # place the reason can be.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wrangler-log-${{ matrix.shard }}
          path: ~/.config/.wrangler/logs
          if-no-files-found: ignore
          retention-days: 7

  # The offline and service-worker drills, on a server of their own. They cut
  # requests off mid-flight — that is what they test — and Wrangler does not
  # always survive it. Here, when it does not, it takes only these with it.
  e2e-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @vadevi/web build
      - run: pnpm e2e:resilience
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-resilience
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wrangler-log-resilience
          path: ~/.config/.wrangler/logs
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Split across two runners, each with its own server.
    #
    # The suite shares one Wrangler process, and on a two-core runner that
    # process has twice fallen over part-way through — once during the offline
    # drills, once during the accessibility sweep. Every test after it then
    # fails with a refused connection, which reads as a broken change and is
    # not one. Halving what any one server has to survive is the part of that
    # we control.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The suite runs against the production build served at one origin,
      # because a service worker does not behave the same under the dev server.
      - run: pnpm --filter @vadevi/web build
      - run: pnpm e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

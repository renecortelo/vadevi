name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede a pull request's own earlier runs. Pushing a correction while the
# previous commit is still building used to pay for both; now the older run is
# cancelled. Never applied to main, where every commit is a distinct state that
# is worth its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level high

  # Did this pull request touch anything a browser could exercise?
  #
  # Prose-only changes are frequent here — a checklist ticked, a doc corrected —
  # and the three browser jobs are three quarters of the bill. There is nothing
  # for them to find in a Markdown diff, so they are skipped when nothing but
  # Markdown moved. Every uncertain answer is "code": no base commit, an
  # unreadable diff, an empty one, or this job failing outright all leave the
  # expensive path running. Only a positive "every changed file ends in .md"
  # skips anything.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs the base commit, which a shallow checkout lacks.
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE...HEAD")
            printf 'changed files:\n%s\n' "$changed"
            # Counted, not matched: `grep -q` exits on its first hit, and what a
            # shell reports for the pipeline it just broke varies between shells
            # (zsh and bash disagree here). A count behaves the same everywhere,
            # which means this is testable outside CI.
            noncode=$(printf '%s\n' "$changed" | grep -cv '\.md$' || true)
            if [ -n "$changed" ] && [ "${noncode:-1}" -eq 0 ]; then
              code=false
            fi
          fi
          echo "browser jobs needed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  e2e:
    # Pull requests only, and only when code moved. A merge to main re-ran the
    # identical tree the pull request had just proved green, and on a private
    # repository that is quota spent to learn nothing. `quality` still runs on
    # main, so a bad merge is not silent.
    #
    # `!cancelled()` rather than `success()`: if `changes` fails, its output is
    # empty, which is not 'false', so these still run. A broken filter must
    # never be able to silently skip the browser suite.
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Split across two runners, each with its own server.
    #
    # The suite shares one Wrangler process, and on a two-core runner that
    # process has fallen over part-way through several times now — during the
    # offline drills, during the accessibility sweep, and after an editing
    # test. Every test after it fails with a refused connection, which reads as
    # a broken change and is not one. There is no test in common between the
    # occurrences and Wrangler prints `✘ [ERROR]` with an empty body, so the
    # cause is still unknown; halving what any one server has to survive is the
    # part of it we control, and the log capture below is how the next one gets
    # diagnosed rather than guessed at.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The suite runs against the production build served at one origin,
      # because a service worker does not behave the same under the dev server.
      - run: pnpm --filter @vadevi/web build
      - run: pnpm e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
      # Wrangler names this file on its way out and we have never read one.
      # When the server dies the console message is empty, so this is the only
      # place the reason can be.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wrangler-log-${{ matrix.shard }}
          path: ~/.config/.wrangler/logs
          if-no-files-found: ignore
          retention-days: 7

  # The offline and service-worker drills, on a server of their own. They cut
  # requests off mid-flight — that is what they test — and Wrangler does not
  # always survive it. Here, when it does not, it takes only these with it.
  e2e-resilience:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @vadevi/web build
      - run: pnpm e2e:resilience
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-resilience
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wrangler-log-resilience
          path: ~/.config/.wrangler/logs
          if-no-files-found: ignore
          retention-days: 7

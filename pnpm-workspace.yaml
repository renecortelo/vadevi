packages:
  - "apps/*"
  - "packages/*"

# Development-only transitive advisories under firebase-tools. Both are patched
# by a newer minor of the transitive package, so the override raises the floor
# without changing any direct dependency. The Firebase Auth Emulator workflow is
# retested after any change here.
overrides:
  uuid@9: ">=11.1.1"
  "@opentelemetry/core": ">=2.8.0"
  fast-uri: ">=3.1.6"

catalog:
  typescript: "6.0.3"
  vitest: "*"
  zod: "*"

allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true
  re2: false
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/vitest-pool-workers@0.21.1"
  - miniflare@5.20260804.1-alpha
  - wrangler@4.121.0

packages:
  - "apps/*"
  - "packages/*"

# Development-only transitive advisories. Each is patched by a newer version of
# the transitive package, so the override raises the floor without changing any
# direct dependency, and none of these ship in the deployed Worker — they sit
# under wrangler/miniflare (dev server, tests) and firebase-tools (auth
# emulator). The Firebase Auth Emulator workflow is retested after any change.
overrides:
  uuid@9: ">=11.1.1"
  "@opentelemetry/core": ">=2.8.0"
  # Kept within 3: an open ">=3.1.6" resolved to 4.1.4, which has advisories
  # of its own (fixed in 4.1.5) and is not the major ajv 8 asks for.
  fast-uri@3: ">=3.1.6 <4"
  fast-uri@4: ">=4.1.5"
  # Advisories on ip-address <=10.7.0, under firebase-tools >
  # @modelcontextprotocol/sdk > express-rate-limit. Emulator only.
  ip-address: ">=10.7.1"
  # GHSA-g89c-p67h-r497 (libheif) and GHSA-wq5f-xc86-pv6w (librsvg) via sharp,
  # under wrangler>miniflare and the vitest worker pool. Dev/build tooling
  # only; not in the Worker.
  sharp: ">=0.35.5"
  # GHSA-68fv-2mgg-jv7q (source-map-js), under vite>postcss and jsdom's CSS
  # parser. Build and test tooling only.
  source-map-js: ">=1.2.2 <2"
  # GHSA-jqcg-44mw-7w3h (proxy-addr), GHSA-vc2v-76pw-4v95 (compression) and
  # GHSA-6qxp-vccf-f47h (@modelcontextprotocol/sdk), all under firebase-tools.
  # Emulator only; each patched within its major.
  proxy-addr: ">=2.0.8 <3"
  compression: ">=1.8.2 <2"
  "@modelcontextprotocol/sdk": ">=1.31.0 <2"
  # GHSA-pqg4-j6r4-53mv (shell-quote), under concurrently, which runs the two
  # dev servers with fixed commands. Local development only.
  shell-quote: ">=1.11.0 <2"
  # GHSA-2883-xcg3-v3hh (js-yaml CPU), under firebase-tools. Emulator only.
  js-yaml@4: ">=4.3.2"
  # GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g (qs), GHSA-jxfw-x594-9x9m
  # (morgan): both under firebase-tools, both patched in a minor. Emulator only.
  qs: ">=6.16.0"
  morgan: ">=1.12.0"
  # GHSA-rfgv-xxqx-mfg5 (undici WebSocket subprotocol DoS), under wrangler,
  # miniflare, jsdom and firebase-tools: a patch release in each major. The
  # Worker uses the runtime's fetch, not undici.
  undici@6: ">=6.28.1 <7"
  undici@7: ">=7.29.1 <8"
  undici@8: ">=8.10.2 <9"
  # GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p (brace-expansion), under
  # eslint and firebase-tools: a patch release in each major. Tooling only.
  brace-expansion@1: ">=1.1.20 <2"
  brace-expansion@2: ">=2.1.6 <3"
  brace-expansion@5: ">=5.0.11 <6"
  # GHSA-m9gg-hp2v-232j (@grpc/grpc-js), under firebase-tools and the Firebase
  # SDK's Node build of Firestore, which the browser bundle does not include.
  "@grpc/grpc-js": ">=1.14.5 <2"
  # GHSA-c475-qrg2-pj4r (basic-ftp), under firebase-tools>proxy-agent, used
  # only to fetch a PAC file over ftp:, which the emulator never does. The fix
  # is a major; its API for that use is unchanged.
  basic-ftp: ">=6.2.1"
  # Not overridden: stream-json (GHSA-528h-pc64-c93x, fixed in 3.x) and
  # csv-parse (GHSA-8cw4-87c7-c6xx, fixed in 7.x) under firebase-tools are
  # major bumps the emulator has not been tested against; both are moderate,
  # development-only, and wait for firebase-tools to move.

catalog:
  typescript: "6.0.3"
  vitest: "^4.1.11"
  zod: "*"

allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true
  re2: false
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/vitest-pool-workers@0.21.1"
  - miniflare@5.20260804.1-alpha || 5.20260916.0-alpha
  - wrangler@4.121.0 || 4.133.0

auditConfig:
  ignoreGhsas:
    # braces, ReDoS-style stack exhaustion, under firebase-tools>chokidar (the
    # emulator's file watcher) and test tooling. No patched release exists yet
    # (3.0.3 is the latest); override to ">=3.0.4 <4" and drop this entry once
    # one is published. Never reaches the Worker or the browser bundle.
    - GHSA-vfj7-8cjw-p6xm
